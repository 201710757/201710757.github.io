about: >-
  My research aims to decode, model, and modulate human cognition and behavior from brain
  signals. I work on real-time fMRI neurofeedback for interoception modulation and develop
  brain decoding methods that map neural activity to semantic representations using large
  language models and fMRI encoders. During my M.S. and B.S., I built neuroscience-inspired
  reinforcement learning agents that adapt quickly through prefrontal meta-control.

interests:
  - Real-time fMRI neurofeedback
  - Interoception
  - Brain decoding
  - Large language models
  - Neuroscience-inspired reinforcement learning

