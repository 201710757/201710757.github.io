title: Jihun Kim
author: Jihun Kim
email: neti2207@gmail.com
description: > # this means to ignore newlines until "show_exerpts:"
  Jihun Kim — Ph.D. candidate in Brain and Cognitive Engineering at Korea University.
  Real-time fMRI neurofeedback, brain decoding with large language models, and neuroscience-inspired reinforcement learning.
url: "https://201710757.github.io"
show_excerpts: true # set to true to show excerpts on the homepage

# Minima date format
# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
sass:
  sass_dir: _sass
plainwhite:
  name: Jihun Kim
  tagline: Blog
  date_format: "%b %-d, %Y"
  sitemap: true # set to true to generate sitemap.xml content
  search: true # set to true to enable searchbar
  dark_mode: true # set to true to add dark mode toggle
  portfolio_image: "assets/face_img.png" # the path from the base directory of the site to the image to display (no / at the start)
  html_lang: "kr" # set the lang attribute of the <html> tag for the pages. See here for a list of codes: https://www.w3schools.com/tags/ref_country_codes.asp
  condensed_mobile:
    #- home
    - page
    - post
  # generate social links in footer
  social_links:
    #twitter: samarsault
    github:  201710757
    #linkedIn: in/samarsault
    
    #dribbble: jekyll
    #flickr:   jekyll
    #instagram: jekyll
    #pinterest: jekyll
    #youtube: jekyll
    #facebook: jekyll
    #soundcloud: jekyll
    #telegram: jekyll
    #gitlab: jekyll
    #email: jekyll

    # Mastodon instances
    # mastodon:
    # - username: jekyll
    #   instance: example.com
    # - username: jekyll2
    #   instance: example.com
  analytics_id: "G-2MMKGS8TBB"
  navigation:
    - title: CV
      url: /
    - title: Blog
      url: /blog/
# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
#header_pages:
# - about.md

# Build settings
# Theme files (plainwhite) are vendored in this repo; no theme gem is needed.
theme: null

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
#  - jekyll-feed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

defaults:
  - scope:
      path: "blog"
      type: posts
    values:
      permalink: /blog/:year/:month/:day/:title:output_ext

exclude:
  - readme.md
  - readme_sub.md
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - plainwhite.gemspec
  - screenshot.png
  - dark.png
  - blog/_posts/makePost.sh
  - blog/_posts/makePost.command
